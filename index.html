<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dressing IA</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#f7f5f0">


<style>

*{
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial;
}


body{

margin:0;

background:#f7f5f0;

color:#111;

}


header{

padding:30px 25px;

font-size:34px;

font-weight:700;

letter-spacing:-1px;

}


.page{

display:none;

padding-bottom:110px;

}


.active{

display:block;

}


.card{

background:white;

margin:20px;

padding:25px;

border-radius:35px;

box-shadow:
0 15px 40px rgba(0,0,0,.06);

}



.hero{

height:420px;

display:flex;

justify-content:center;

align-items:center;

font-size:80px;

background:
linear-gradient(
135deg,
#fff,
#eee8df
);

}



.button{

width:100%;

padding:18px;

border:none;

border-radius:40px;

background:#111;

color:white;

font-size:16px;

}



.secondary{

background:#eee;

color:#111;

}



.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:15px;

margin:20px;

}



.item{

background:white;

border-radius:30px;

overflow:hidden;

}


.item img{

width:100%;

height:180px;

object-fit:cover;

}



.item div{

padding:15px;

}


.item button{

background:#111;

color:white;

border:none;

padding:10px 18px;

border-radius:20px;

margin-top:10px;

}



input,select{

width:100%;

padding:15px;

margin-bottom:12px;

border-radius:20px;

border:1px solid #ddd;

background:white;

}


nav{

position:fixed;

bottom:0;

left:0;

right:0;

height:75px;

background:white;

display:flex;

justify-content:space-around;

align-items:center;

border-top:1px solid #ddd;

}


nav button{

background:none;

border:none;

font-size:14px;

}


.tag{

display:inline-block;

background:#eee;

padding:8px 14px;

border-radius:20px;

font-size:13px;

margin:3px;

}


</style>

</head>


<body>


<header>

Dressing IA

</header>

<section id="home" class="page active">


<div class="card hero">

👕

🧥

👖

👟

</div>



<div class="card">

<h2>
✨ Inspiration du jour
</h2>


<p id="daily">

Une tenue parfaite selon ton dressing.

</p>


<button class="button"
onclick="generateOutfit()">

Créer ma tenue

</button>


</div>




<div class="card">

<h2>
À redécouvrir
</h2>


<p>

Ce pull pourrait créer 14 nouvelles tenues.

</p>


</div>



</section>





<section id="dressing" class="page">


<div class="card">


<h1>
Mon dressing
</h1>


<p>
Ajoute tes pièces et construis ton style.
</p>


</div>



<div id="clothes" class="grid">

</div>




<div class="card">


<h2>
➕ Ajouter un vêtement
</h2>



<input
type="file"
id="photo"
accept="image/*">



<input
id="name"
placeholder="Nom du vêtement">



<select id="category">

<option>
Haut
</option>

<option>
Veste
</option>

<option>
Pantalon
</option>

<option>
Chaussure
</option>

<option>
Accessoire
</option>

</select>



<input
id="brand"
placeholder="Marque">



<input
id="color"
placeholder="Couleur">



<select id="season">


<option>
Printemps
</option>

<option>
Été
</option>

<option>
Automne
</option>

<option>
Hiver
</option>


</select>




<button class="button"
onclick="addClothing()">

Ajouter au dressing

</button>



</div>



</section>







<section id="create" class="page">


<div class="card">


<h1>
✨ Composer
</h1>



<p>

Laisse l'application imaginer une tenue.

</p>



<div id="outfit">

Aucune tenue générée.

</div>



<br>



<button class="button"
onclick="generateOutfit()">

✨ Inspiration

</button>



<br><br>



<button class="button secondary"
onclick="likeOutfit()">

❤️ J'adore

</button>



</div>


</section>






<nav>


<button onclick="show('home')">

🏠
<br>
Accueil

</button>



<button onclick="show('dressing')">

👕

<br>
Dressing

</button>



<button onclick="show('create')">

✨

<br>
Créer

</button>


</nav>

<script>


let clothes =
JSON.parse(
localStorage.getItem("clothes")
)
|| [];





function show(page){


document
.querySelectorAll(".page")
.forEach(
p=>p.classList.remove("active")
);



document
.getElementById(page)
.classList.add("active");


}







function addClothing(){



let file =
document
.getElementById("photo")
.files[0];



if(!file){

alert("Ajoute une photo 📸");

return;

}



let reader =
new FileReader();





reader.onload=function(e){



let clothing={


image:e.target.result,



name:
document
.getElementById("name")
.value
||
"Sans nom",



category:
document
.getElementById("category")
.value,



brand:
document
.getElementById("brand")
.value
||
"Sans marque",



color:
document
.getElementById("color")
.value
||
"Non défini",



season:
document
.getElementById("season")
.value,



worn:0,



lastWear:"Jamais"

};



clothes.push(clothing);



localStorage.setItem(

"clothes",

JSON.stringify(clothes)

);



displayClothes();



alert(
"✨ Vêtement ajouté au dressing !"
);



};



reader.readAsDataURL(file);



}







function displayClothes(){



let container =
document
.getElementById("clothes");



container.innerHTML="";




clothes.forEach(

(c,index)=>{



container.innerHTML +=`


<div class="item">


<img src="${c.image}">


<div>


<h3>

${c.name}

</h3>



<span class="tag">

${c.category}

</span>



<span class="tag">

${c.season}

</span>




<p>

${c.brand}

</p>



<p>

Couleur :

${c.color}

</p>



<p>

👕 Porté :

${c.worn}

fois

</p>



<p>

Dernière fois :

${c.lastWear}

</p>



<button onclick="wear(${index})">

👕 Porter

</button>



</div>


</div>



`;



}


);



}







function wear(index){



clothes[index].worn++;



clothes[index].lastWear =

new Date()

.toLocaleDateString();



localStorage.setItem(

"clothes",

JSON.stringify(clothes)

);



displayClothes();



}








function randomItem(array){


return array[

Math.floor(

Math.random()*array.length

)

];



}








function generateOutfit(){



let hauts =

clothes.filter(

c=>c.category==="Haut"

);



let pantalons =

clothes.filter(

c=>c.category==="Pantalon"

);



let chaussures =

clothes.filter(

c=>c.category==="Chaussure"

);





if(

hauts.length===0 ||

pantalons.length===0 ||

chaussures.length===0

){


document

.getElementById("outfit")

.innerHTML =


"Ajoute au moins un haut, un pantalon et une paire de chaussures 👕👖👟";



return;



}






let tenue=[


randomItem(hauts),


randomItem(pantalons),


randomItem(chaussures)



];





let result="";





tenue.forEach(c=>{



result +=`


<p>

${c.name}


<br>


<span class="tag">

${c.color}

</span>



</p>


`;



});





document

.getElementById("outfit")

.innerHTML=result;



document

.getElementById("daily")

.innerHTML=result;




}








function likeOutfit(){


alert(

"❤️ Super ! L'application apprend que cette combinaison te plaît."

);


}







displayClothes();



</script>



</body>


</html>
